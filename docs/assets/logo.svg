<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title">
  <title id="title">Pendulum logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <!-- grid levels: sell levels (top, warm) and buy levels (bottom, cool) -->
  <g stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6">
    <line x1="30" y1="96" x2="170" y2="96" stroke="#f97316" opacity="0.55"/>
    <line x1="26" y1="116" x2="174" y2="116" stroke="#f97316" opacity="0.8"/>
    <line x1="26" y1="136" x2="174" y2="136" stroke="#22d3ee" opacity="0.8"/>
    <line x1="32" y1="156" x2="168" y2="156" stroke="#22d3ee" opacity="0.55"/>
  </g>
  <!-- swing arc -->
  <path d="M 51.8 112.8 A 84 84 0 0 0 148.2 112.8" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
  <!-- pivot and rod -->
  <line x1="100" y1="44" x2="132" y2="122" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="44" r="8" fill="#e2e8f0"/>
  <!-- bob -->
  <circle cx="132" cy="122" r="18" fill="url(#bob)" stroke="#f0fdfa" stroke-width="3"/>
</svg>
