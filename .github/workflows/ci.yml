name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pendulum
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: pendulum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pendulum"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: pendulum
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: pendulum
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      # GitHub runners are US-based and Bybit blocks US IPs, so tests marked `live` are skipped here.
      - run: uv run pytest -q -m "integration and not live"

  compose-and-image:
    name: Compose validation and image build
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.local.yml config --quiet
      - run: docker compose -f docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pendulum:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
