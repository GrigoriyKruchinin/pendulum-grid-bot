# Reference deployment of the analyzer stack to a VPS over SSH.
#
# Manual only (workflow_dispatch) and disabled unless the repository variable DEPLOY_ENABLED is "true".
# Required secrets when enabled: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (key of a dedicated deploy user).
# The server keeps its own `.env` (never stored in the repository or the image) next to docker-compose.yml.
name: Deploy (reference)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (git SHA or vX.Y.Z); empty = build this commit"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    if: ${{ vars.DEPLOY_ENABLED == 'true' && inputs.version == '' }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/grigoriykruchinin/pendulum-grid-bot:${{ steps.meta.outputs.tag }}
            ghcr.io/grigoriykruchinin/pendulum-grid-bot:latest

  deploy:
    name: Deploy to server
    needs: [image]
    # Runs after a fresh build, or alone when an existing version is given (rollback).
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (needs.image.result == 'success' || inputs.version != '') }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload compose file and config
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/pendulum/"
          scp -i ~/.ssh/deploy_key -r config "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/pendulum/"
      - name: Pull, migrate, start, verify
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ~/pendulum && export PENDULUM_VERSION=${VERSION} && \
             docker compose pull && \
             docker compose run --rm migrations && \
             docker compose up -d --remove-orphans && \
             sleep 90 && \
             test -z \"\$(docker compose ps --format '{{.Health}}' | grep -E 'unhealthy|starting')\""
